<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tip Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="calc-section">
            
            <div class="calc-card">
                <h1 class="calc-heading">Tip Calculator</h1>
                <p class="calc-subheading">Enter Your Bill And Choose A Tip Percentage</p>
            

                <!--The main container-->
                <div class="calc-inputs-container">
                    <div class="input-group">
                        <label class="input-label" for="bill-amount">Bill Amount</label>
                        <div class="input-container">
                            <span class="input-symbol">$</span>
                            <input type="number" class="calc-input" id="bill-amount" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Tip Percentage</label>
                        <div class="input-container">
                            <input type="number" class="calc-input percentage-input" id="tip-percentage" min="0" max="100" placeholder="20">
                            <span class="input-symbol">%</span>
                        </div>
                    </div>
                </div>

                <!--An empty paragraph to display an error message-->
                <p class="error-message" id="error-message"></p>

                <button class="calc-btn" id="calc-btn">Calculate Tip</button>

                <!--This section is to display the results-->
                <div class="results-container">
                    <div class="result">
                        <p class="result-label">Tip Amount</p>
                        <p class="result-amount" id="tip-amount">$0.00</p>
                    </div>

                    <div class="result-divider"></div>

                    <div class="result">
                        <p class="result-label">Total Bill</p>
                        <p class="result-amount" id="total-bill">$0.00</p>
                    </div>
                </div>
            </div>
        </main>

        <script src="app.js"></script>
    </body>
</html>
